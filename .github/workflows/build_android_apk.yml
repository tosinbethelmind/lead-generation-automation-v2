name: Build Standalone Android APK

on:
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'Directory slug of the app in android_apps/'
        required: true
        default: 'bethelmind_business_os'
  push:
    paths:
      - 'android_apps/**'

jobs:
  build:
    name: Build APK in Cloud
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          APP_NAME="${{ github.event.inputs.app_slug || 'bethelmind_business_os' }}"
          cd android_apps/$APP_NAME
          gradle assembleDebug --stacktrace

      - name: Rename Output APK
        run: |
          APP_NAME="${{ github.event.inputs.app_slug || 'bethelmind_business_os' }}"
          mkdir -p output_apk
          cp android_apps/$APP_NAME/app/build/outputs/apk/debug/*.apk output_apk/$APP_NAME-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bethelmind_business_os-debug-apk
          path: output_apk/*.apk

      - name: Publish to GitHub Releases (Direct Permanent Download Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-apk-v1.0
          name: 'Bethelmind Mobile Business OS — Official Android APK'
          body: |
            ### 📱 Bethelmind Business OS (Official Android App)
            **CAC Certified:** Bethelmind Digital Solutions (Reg: 9912717)
            **Settlement:** Moniepoint Microfinance Bank (6805375225)
            
            Directly installable on any Android phone (Zero Play Store wait required).
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
