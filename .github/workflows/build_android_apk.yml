name: Build Standalone Android APK

on:
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'Directory slug of the app in android_apps/ (e.g. sample_business_app)'
        required: true
        default: 'sample_business_app'

jobs:
  build:
    name: Build APK in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android_apps/${{ github.event.inputs.app_slug }}
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2.2
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android_apps/${{ github.event.inputs.app_slug }}
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_slug }}-debug-apk
          path: android_apps/${{ github.event.inputs.app_slug }}/app/build/outputs/apk/debug/*.apk
