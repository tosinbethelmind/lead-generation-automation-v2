name: Build Standalone Android APK

on:
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'Directory slug of the app in android_apps/'
        required: true
        default: 'bethelmind_business_os'

jobs:
  build:
    name: Build APK in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'

      - name: Build Debug APK
        run: |
          cd android_apps/${{ github.event.inputs.app_slug }}
          gradle assembleDebug --stacktrace

      - name: Rename Output APK
        run: |
          mkdir -p output_apk
          cp android_apps/${{ github.event.inputs.app_slug }}/app/build/outputs/apk/debug/*.apk output_apk/${{ github.event.inputs.app_slug }}-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_slug }}-debug-apk
          path: output_apk/*.apk

      - name: Publish to GitHub Releases (Direct Permanent Download Link)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-apk-v1.0
          name: 'Bethelmind Mobile Business OS — Official Android APK'
          body: |
            ### 📱 Bethelmind Business OS (Official Android App)
            **CAC Certified:** Bethelmind Digital Solutions (Reg: 9912717)
            **Settlement:** Moniepoint Microfinance Bank (6805375225)
            
            Directly installable on any Android phone (Zero Play Store wait required).
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
