name: 24/7 Cloud Background Job Runner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_runner, run_queue, process_jobs]

concurrency:
  group: cloud-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-background-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        continue-on-error: true
        run: npm ci --prefer-offline --no-audit || npm install --legacy-peer-deps || true

      - name: Run GitHub Actions Cloud Runner Daemon
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://pnsrjsyiygxdcxkpgbzx.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuc3Jqc3lpeWd4ZGN4a3BnYnp4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDM1NDUxNywiZXhwIjoyMDk1OTMwNTE3fQ.uNuu3YwMOGS2uZR4S8mayKX_wivIXnDyOrf2vROhna8' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://pnsrjsyiygxdcxkpgbzx.supabase.co' }}
        run: |
          echo "🚀 Starting Cloud Runner Pass..."
          node scripts/github_actions_runner.js || exit 0
