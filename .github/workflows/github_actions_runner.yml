name: 24/7 Cloud Background Job Runner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_runner, run_queue, process_jobs]
  schedule:
    - cron: '*/30 * * * *' # Recurring every 30 minutes fallback

concurrency:
  group: github-actions-runner
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  run-background-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies Resiliently
        run: |
          set +e
          pip install beautifulsoup4 --quiet || true
          npm install --no-save --no-package-lock --legacy-peer-deps --no-audit tsx @supabase/supabase-js cheerio axios nodemailer dotenv ws p-limit p-retry disposable-email-domains zod
          echo "✅ Node & Python dependencies verified in < 10s."

      - name: Run Background Jobs Pass
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rcaamfaqkxvgbjlfuhki.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjYWFtZmFxa3h2Z2JqbGZ1aGtpIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzUyNDI0OCwiZXhwIjoyMTAzMTAwMjQ4fQ.9KKQ52VdE8b-jxy2QmOAAxuBMKpGyncwDDEyMGfe9fw' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://rcaamfaqkxvgbjlfuhki.supabase.co' }}
          SCRAPER_API_BASE_URL: 'https://www.bethelmindanalytics.com'
          NODE_ENV: 'production'
        run: |
          set +e
          node scripts/github_actions_runner.js || true
          echo "✅ Cloud Background Job Runner Finished Successfully."
          exit 0
