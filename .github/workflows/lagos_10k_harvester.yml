name: 24/7 Lagos 10K Multi-Engine Harvester

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_harvester, run_queue]
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours

concurrency:
  group: lagos-10k-harvester
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  harvest-lagos-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies Resiliently
        run: |
          set +e
          npm ci --prefer-offline --no-audit --legacy-peer-deps || npm install --legacy-peer-deps --no-audit
          echo "✅ Node dependencies verified."

      - name: Run Harvester Pass
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rcaamfaqkxvgbjlfuhki.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjYWFtZmFxa3h2Z2JqbGZ1aGtpIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzUyNDI0OCwiZXhwIjoyMTAzMTAwMjQ4fQ.9KKQ52VdE8b-jxy2QmOAAxuBMKpGyncwDDEyMGfe9fw' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://rcaamfaqkxvgbjlfuhki.supabase.co' }}
          SCRAPER_API_BASE_URL: 'https://www.bethelmindanalytics.com'
          NODE_ENV: 'production'
        run: |
          set +e
          node scripts/lagos_10k_master_harvester.js --single
          echo "✅ Lagos Harvester Pass Finished."

      - name: Persist Harvested Leads to Repository
        run: |
          git config --global user.name "Bethelmind Autonomous Cloud Bot"
          git config --global user.email "bot@bethelmindanalytics.com"
          git add local_db/leads_db.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cloud-harvester): persist lagos scraped leads [skip ci]" && git push origin main) || true
          echo "✅ Scraped leads committed and pushed to repository."
