name: 24/7 Lagos 10K Multi-Engine Harvester

on:
  schedule:
    # Run every 30 minutes 24/7 in the cloud (even when laptop is closed)
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_harvester, run_queue]

jobs:
  harvest-lagos-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit || npm install --legacy-peer-deps

      - name: Run 24/7 Master Lagos 10K Harvester (All 7 Free Engines)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://szyuterncawfxwzhvwcf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6eXV0ZXJuY2F3Znh3emh2d2NmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MjM5ODIwOSwiZXhwIjoyMDk3OTc0MjA5fQ._SzfC4NE4KCwWkK_GFQAyQjgkFrQLhbpz1w9R3FIUBY' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://szyuterncawfxwzhvwcf.supabase.co' }}
        run: |
          echo "🚀 Launching 24/7 Cloud Harvester Pass..."
          node scripts/lagos_10k_master_harvester.js --single
