name: Cloud Android APK Builder (Zero Laptop Overhead)

on:
  workflow_dispatch:
    inputs:
      lead_slug:
        description: 'Client Prototype Slug (e.g. apex-solar-technologies-lagos)'
        required: true
        default: 'apex-solar-technologies-lagos'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Client Capacitor Project
        run: |
          node scripts/build_client_apk.js "${{ github.event.inputs.lead_slug }}"

      - name: Initialize and Build Android APK in Cloud
        run: |
          SLUG="${{ github.event.inputs.lead_slug }}"
          cd "client_mobile_apps/${SLUG}"
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.lead_slug }}-android-app"
          path: "client_mobile_apps/${{ github.event.inputs.lead_slug }}/android/app/build/outputs/apk/debug/*.apk"
          retention-days: 30
