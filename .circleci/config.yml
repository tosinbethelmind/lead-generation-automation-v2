version: 2.1

executors:
  node-browser-executor:
    docker:
      - image: cimg/node:22.0.0-browsers

jobs:
  # ─── Job 1: 10K Lagos B2B Engine Harvester ─────────────────────────────────
  lagos-10k-harvester:
    executor: node-browser-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: npm install --no-audit --no-fund
      - run:
          name: Install Playwright Chromium
          command: npx playwright install chromium || true
      - run:
          name: Execute Lagos 10K Lead Harvester Matrix
          command: |
            echo "🚀 Executing Lagos B2B Matrix Harvester..."
            node scripts/async_lagos_10k_scraper.js --zone ikeja_alausa --count 2000 || true
            node scripts/async_lagos_10k_scraper.js --zone lekki_vi --count 2000 || true
            node scripts/async_lagos_10k_scraper.js --zone yaba_surulere --count 2000 || true
            node scripts/async_lagos_10k_scraper.js --zone ikorodu_oshodi --count 2000 || true
            node scripts/async_lagos_10k_scraper.js --zone alimosho_apapa --count 2000 || true
            
            echo "📊 Aggregating Lagos leads..."
            node scripts/lagos_10k_master_harvester.js --count 10000 || true

  # ─── Job 2: Solar 5K Lead Harvester Engine ────────────────────────────────
  solar-5k-harvester:
    executor: node-browser-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: npm install --no-audit --no-fund
      - run:
          name: Install Playwright Chromium
          command: npx playwright install chromium || true
      - run:
          name: Execute Solar 5K Lead Harvester
          command: |
            echo "☀️ Executing Solar 5K Harvester..."
            node scripts/solar_5k_master_harvester.js || true

workflows:
  version: 2
  # Run Lagos 10K Harvester every 6 hours automatically
  lagos-harvester-schedule:
    triggers:
      - schedule:
          cron: "0 */6 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - lagos-10k-harvester

  # Run Solar 5K Harvester every 12 hours automatically
  solar-harvester-schedule:
    triggers:
      - schedule:
          cron: "0 */12 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - solar-5k-harvester
