[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect www to non-www (handled by Vercel primary, Netlify fallback)
[[redirects]]
  from = "https://www.bethelmindanalytics.com/*"
  to = "https://bethelmindanalytics.com/:splat"
  status = 301
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
